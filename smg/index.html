<title>Gravity企画用・セックスマシンガンズ特集・YouTube再生数ランキング（たたき台）</title>
<style>
  :root {
    --bg: #0a0a0c;
    --bg2: #141418;
    --card: #1a1a22;
    --border: #2e2e3a;
    --text: #f0ece6;
    --muted: #9a958c;
    --accent: #e8b84a;
    --metal: #c0c8d4;
    --adopt: #2ecc71;
    --hold: #f1c40f;
    --reject: #e74c3c;
    --adopt-bg: rgba(46,204,113,.18);
    --hold-bg: rgba(241,196,15,.18);
    --reject-bg: rgba(231,76,60,.18);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    min-height: 100%;
  }
  body {
    padding: calc(12px + var(--safe-top)) 12px calc(100px + var(--safe-bottom));
    background:
      radial-gradient(ellipse at top, #1a1210 0%, transparent 55%),
      linear-gradient(180deg, #0c0c10 0%, #0a0a0c 100%);
  }
  header {
    margin-bottom: 14px;
    padding: 14px 14px 16px;
    background: linear-gradient(135deg, #1c1410 0%, #12121a 60%, #0e1016 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(232,184,74,.08), 0 8px 24px rgba(0,0,0,.45);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: .02em;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(232,184,74,.25);
  }
  header .sub {
    margin: 0;
    font-size: .78rem;
    color: var(--muted);
  }
  header .sub strong { color: var(--metal); font-weight: 600; }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: 0 -12px 12px;
    padding: 10px 12px;
    background: rgba(10,10,12,.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .summary {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .chip {
    flex: 1 1 30%;
    min-width: 90px;
    text-align: center;
    padding: 10px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: .85rem;
    font-weight: 700;
  }
  .chip span { display: block; font-size: 1.35rem; line-height: 1.2; }
  .chip.adopt { border-color: rgba(46,204,113,.45); color: var(--adopt); background: var(--adopt-bg); }
  .chip.hold { border-color: rgba(241,196,15,.45); color: var(--hold); background: var(--hold-bg); }
  .chip.reject { border-color: rgba(231,76,60,.45); color: var(--reject); background: var(--reject-bg); }
  .chip.unset { color: var(--muted); }
  .actions {
    display: flex;
    gap: 8px;
  }
  .actions button {
    flex: 1;
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    font-size: .9rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .actions button:active { transform: scale(.98); opacity: .9; }
  .actions .export-btn {
    background: linear-gradient(180deg, #2a2418, #1a1610);
    border-color: rgba(232,184,74,.4);
    color: var(--accent);
  }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    transition: border-color .15s, background .15s;
  }
  .row[data-decision="adopt"] { border-color: rgba(46,204,113,.55); background: linear-gradient(90deg, var(--adopt-bg), var(--card) 40%); }
  .row[data-decision="hold"] { border-color: rgba(241,196,15,.55); background: linear-gradient(90deg, var(--hold-bg), var(--card) 40%); }
  .row[data-decision="reject"] { border-color: rgba(231,76,60,.45); background: linear-gradient(90deg, var(--reject-bg), var(--card) 40%); opacity: .78; }
  .row-top {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .rank {
    flex: 0 0 36px;
    width: 36px; height: 36px;
    border-radius: 10px;
    background: #0e0e14;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    color: var(--accent);
    font-size: .95rem;
  }
  .meta { flex: 1; min-width: 0; }
  .title-link {
    display: block;
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.02rem;
    word-break: break-word;
    padding: 2px 0;
  }
  .title-link:active, .title-link:hover { color: var(--accent); }
  .title-link.disabled {
    color: var(--muted);
    pointer-events: none;
  }
  .views {
    margin-top: 4px;
    font-size: .82rem;
    color: var(--metal);
    font-variant-numeric: tabular-nums;
  }
  .note {
    margin-top: 3px;
    font-size: .72rem;
    color: var(--muted);
  }
  .btns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .btns button {
    min-height: 52px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: #121218;
    color: var(--text);
    font-size: 1rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btns button:active { transform: scale(.97); }
  .btns button[data-v="adopt"].on,
  .btns button[data-v="adopt"]:active { background: var(--adopt); border-color: var(--adopt); color: #06210f; }
  .btns button[data-v="hold"].on,
  .btns button[data-v="hold"]:active { background: var(--hold); border-color: var(--hold); color: #2a2200; }
  .btns button[data-v="reject"].on,
  .btns button[data-v="reject"]:active { background: var(--reject); border-color: var(--reject); color: #fff; }
  .btns button[data-v="adopt"] { color: var(--adopt); }
  .btns button[data-v="hold"] { color: var(--hold); }
  .btns button[data-v="reject"] { color: #ff8a7a; }

  /* Export modal */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 100;
    padding: 16px;
    padding-bottom: calc(16px + var(--safe-bottom));
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%;
    max-width: 560px;
    max-height: 80vh;
    background: #16161e;
    border: 1px solid var(--border);
    border-radius: 16px 16px 12px 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal h2 { margin: 0; font-size: 1rem; color: var(--accent); }
  .modal textarea {
    width: 100%;
    min-height: 220px;
    flex: 1;
    background: #0c0c12;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: .8rem;
    font-family: ui-monospace, Menlo, monospace;
    resize: vertical;
  }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button {
    flex: 1;
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-weight: 700;
    font-family: inherit;
    font-size: .95rem;
    cursor: pointer;
  }
  .modal-actions .copy { background: var(--accent); color: #1a1200; border-color: var(--accent); }
  .modal-actions .close { background: var(--bg2); color: var(--text); }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    background: #222;
    color: #fff;
    padding: 12px 18px;
    border-radius: 999px;
    font-size: .9rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 200;
    border: 1px solid var(--border);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer {
    margin-top: 18px;
    padding: 12px;
    font-size: .72rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>

const STORAGE_KEY = 'smg-gravity-ranking-decisions-v1';

function loadDecisions() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
  } catch (e) { return {}; }
}
function saveDecisions(d) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

function formatViews(n) {
  if (n == null || n === '') return '再生数不明';
  const x = Number(n);
  if (x >= 100000000) return (x/100000000).toFixed(2).replace(/\.?0+$/,'') + '億回';
  if (x >= 10000) {
    const man = x / 10000;
    return (man >= 100 ? Math.round(man) : (Math.round(man * 10) / 10)) + '万回';
  }
  return x.toLocaleString('ja-JP') + '回';
}

function formatViewsExact(n) {
  if (n == null) return '不明';
  return Number(n).toLocaleString('ja-JP') + ' 回';
}

let decisions = loadDecisions();
let exportFormat = 'json';

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  TRACKS.forEach(t => {
    const id = t.videoId || ('no-' + t.rank);
    const dec = decisions[id] || '';
    const row = document.createElement('article');
    row.className = 'row';
    row.dataset.id = id;
    row.dataset.decision = dec;
    const hasUrl = !!t.youtubeUrl;
    const note = t.note ? `<div class="note">${escapeHtml(t.note)}</div>` : '';
    row.innerHTML = `
      <div class="row-top">
        <div class="rank">${t.rank}</div>
        <div class="meta">
          ${hasUrl
            ? `<a class="title-link" href="${escapeAttr(t.youtubeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t.title)}</a>`
            : `<span class="title-link disabled">${escapeHtml(t.title)}</span>`}
          <div class="views">${formatViews(t.viewCount)} <span style="opacity:.65">（${formatViewsExact(t.viewCount)}）</span></div>
          ${note}
        </div>
      </div>
      <div class="btns">
        <button type="button" data-v="adopt" class="${dec==='adopt'?'on':''}">採用</button>
        <button type="button" data-v="hold" class="${dec==='hold'?'on':''}">保留</button>
        <button type="button" data-v="reject" class="${dec==='reject'?'on':''}">却下</button>
      </div>`;
    row.querySelectorAll('.btns button').forEach(btn => {
      btn.addEventListener('click', () => {
        const v = btn.dataset.v;
        if (decisions[id] === v) delete decisions[id];
        else decisions[id] = v;
        saveDecisions(decisions);
        render();
      });
    });
    list.appendChild(row);
  });
  updateSummary();
}

function updateSummary() {
  let a=0,h=0,r=0,u=0;
  TRACKS.forEach(t => {
    const id = t.videoId || ('no-' + t.rank);
    const d = decisions[id];
    if (d==='adopt') a++;
    else if (d==='hold') h++;
    else if (d==='reject') r++;
    else u++;
  });
  document.getElementById('c-adopt').textContent = a;
  document.getElementById('c-hold').textContent = h;
  document.getElementById('c-reject').textContent = r;
  document.getElementById('c-unset').textContent = u;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s);
}

function buildExport(fmt) {
  const rows = TRACKS.map(t => {
    const id = t.videoId || ('no-' + t.rank);
    return {
      rank: t.rank,
      title: t.title,
      youtubeUrl: t.youtubeUrl,
      videoId: t.videoId,
      viewCount: t.viewCount,
      note: t.note || null,
      decision: decisions[id] || null,
      decisionLabel: ({adopt:'採用',hold:'保留',reject:'却下'})[decisions[id]] || '未選択'
    };
  });
  if (fmt === 'json') {
    return JSON.stringify({
      title: 'Gravity企画用・セックスマシンガンズ特集・選択結果',
      exportedAt: new Date().toISOString(),
      summary: {
        採用: rows.filter(x => x.decision==='adopt').length,
        保留: rows.filter(x => x.decision==='hold').length,
        却下: rows.filter(x => x.decision==='reject').length,
        未選択: rows.filter(x => !x.decision).length
      },
      tracks: rows
    }, null, 2);
  }
  const label = {adopt:'【採用】',hold:'【保留】',reject:'【却下】'};
  const lines = ['Gravity企画用・セックスマシンガンズ特集・選択結果', '---'];
  ['adopt','hold','reject'].forEach(k => {
    const list = rows.filter(x => x.decision === k);
    lines.push(`\n${label[k]} (${list.length})`);
    list.forEach(x => {
      const v = x.viewCount != null ? formatViewsExact(x.viewCount) : '再生数不明';
      lines.push(`${x.rank}. ${x.title} — ${v}` + (x.youtubeUrl ? `\n   ${x.youtubeUrl}` : ''));
    });
  });
  const unset = rows.filter(x => !x.decision);
  lines.push(`\n【未選択】 (${unset.length})`);
  unset.forEach(x => lines.push(`${x.rank}. ${x.title}`));
  return lines.join('\n');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('btn-export').addEventListener('click', () => {
  exportFormat = 'json';
  document.getElementById('export-out').value = buildExport('json');
  document.getElementById('modal').classList.add('open');
});
document.getElementById('fmt-json').addEventListener('click', () => {
  exportFormat = 'json';
  document.getElementById('export-out').value = buildExport('json');
});
document.getElementById('fmt-text').addEventListener('click', () => {
  exportFormat = 'text';
  document.getElementById('export-out').value = buildExport('text');
});
document.getElementById('btn-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
});
document.getElementById('btn-copy').addEventListener('click', async () => {
  const text = document.getElementById('export-out').value;
  try {
    await navigator.clipboard.writeText(text);
    showToast('コピーしました');
  } catch (e) {
    document.getElementById('export-out').select();
    showToast('テキストを選択しました（長押しでコピー）');
  }
});
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('すべての採用／保留／却下をリセットしますか？')) return;
  decisions = {};
  saveDecisions(decisions);
  render();
  showToast('リセットしました');
});

render();
</script>
